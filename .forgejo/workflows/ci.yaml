
name: Booklegion CI

on:
  push:
  pull_request:

jobs:
  tribune-logistica:
    name: Tribune Logistica (Go)
    runs-on: Aria-ci
    defaults:
      run:
        working-directory: tribune_logistica

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tribune_logistica/go.mod
          cache-dependency-path: tribune_logistica/go.sum

      - name: Run tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: tribune_logistica

  rust:
    name: Rust (${{ matrix.project }})
    runs-on: Aria-ci
    strategy:
      fail-fast: false
      matrix:
        project:
          - lector
          - tribune_archivum

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::cognitive_complexity

      - name: Run tests
        run: cargo test --locked
